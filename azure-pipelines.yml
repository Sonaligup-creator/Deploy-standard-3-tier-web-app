trigger: none
pr: none

parameters:
  - name: acrLoginServer
    type: string
    default: 'acrthreetierdev123.azurecr.io'
  - name: aksResourceGroup
    type: string
    default: 'rg-three-tier-dev'
  - name: aksClusterName
    type: string
    default: 'aks-three-tier-dev'
  - name: kubernetesNamespace
    type: string
    default: 'three-tier'
  - name: helmReleaseName
    type: string
    default: 'three-tier'
  - name: workloadIdentityClientId
    type: string
    default: 'REPLACE_WITH_TERRAFORM_WORKLOAD_IDENTITY_CLIENT_ID'
  - name: workloadIdentityTenantId
    type: string
    default: 'REPLACE_WITH_AZURE_TENANT_ID'
  - name: keyVaultName
    type: string
    default: 'kvthreetierdev123'
  - name: ingressHost
    type: string
    default: 'hotelreservationweb.me'

stages:
  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: BuildImages
        displayName: Build API and Frontend Images
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and push API image
            inputs:
              containerRegistry: 'sc-acr'
              repository: 'three-tier-api'
              command: 'buildAndPush'
              Dockerfile: 'api/Dockerfile'
              buildContext: 'api'
              tags: |
                $(Build.SourceVersion)
                latest

          - task: Docker@2
            displayName: Build and push Frontend image
            inputs:
              containerRegistry: 'sc-acr'
              repository: 'three-tier-frontend'
              command: 'buildAndPush'
              Dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              tags: |
                $(Build.SourceVersion)
                latest

  - stage: ValidateHelm
    displayName: Validate Helm Governance
    dependsOn: Build
    jobs:
      - job: LintAndTemplate
        displayName: Helm Schema and Template Validation
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 'latest'

          - script: |
              set -euo pipefail
              helm lint helm/three-tier-app
              helm template three-tier helm/three-tier-app \
                -f helm/three-tier-app/values.yaml \
                -f helm/three-tier-app/environments/values-dev.yaml \
                --set api.image.repository=${{ parameters.acrLoginServer }}/three-tier-api \
                --set api.image.tag=$(Build.SourceVersion) \
                --set frontend.image.repository=${{ parameters.acrLoginServer }}/three-tier-frontend \
                --set frontend.image.tag=$(Build.SourceVersion)
            displayName: Run Helm lint and render

  - stage: DeployAKS
    displayName: Deploy to AKS with Helm
    dependsOn: ValidateHelm
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: HelmDeploy
        displayName: Helm Upgrade Install
        environment: aks-dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@1
                  displayName: Install Helm
                  inputs:
                    helmVersionToInstall: 'latest'

                - task: AzureCLI@2
                  displayName: Helm deploy to AKS
                  inputs:
                    azureSubscription: 'sc-azure'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials --resource-group ${{ parameters.aksResourceGroup }} --name ${{ parameters.aksClusterName }} --overwrite-existing
                      kubectl create namespace ${{ parameters.kubernetesNamespace }} --dry-run=client -o yaml | kubectl apply -f -

                      helm upgrade --install ${{ parameters.helmReleaseName }} helm/three-tier-app \
                        --namespace ${{ parameters.kubernetesNamespace }} \
                        -f helm/three-tier-app/values.yaml \
                        -f helm/three-tier-app/environments/values-dev.yaml \
                        --set global.ingress.host=${{ parameters.ingressHost }} \
                        --set global.workloadIdentity.clientId=${{ parameters.workloadIdentityClientId }} \
                        --set global.workloadIdentity.tenantId=${{ parameters.workloadIdentityTenantId }} \
                        --set global.workloadIdentity.keyVaultName=${{ parameters.keyVaultName }} \
                        --set api.image.repository=${{ parameters.acrLoginServer }}/three-tier-api \
                        --set api.image.tag=$(Build.SourceVersion) \
                        --set frontend.image.repository=${{ parameters.acrLoginServer }}/three-tier-frontend \
                        --set frontend.image.tag=$(Build.SourceVersion)

                      echo ""
                      echo "========== Three-Tier Deployment Details =========="
                      echo "AKS resource group: ${{ parameters.aksResourceGroup }}"
                      echo "AKS cluster: ${{ parameters.aksClusterName }}"
                      echo "Namespace: ${{ parameters.kubernetesNamespace }}"
                      echo "Helm release: ${{ parameters.helmReleaseName }}"
                      echo "Ingress host: ${{ parameters.ingressHost }}"
                      echo ""
                      echo "Pods:"
                      kubectl get pods -n ${{ parameters.kubernetesNamespace }} -o wide
                      echo ""
                      echo "Services:"
                      kubectl get svc -n ${{ parameters.kubernetesNamespace }}
                      echo ""
                      echo "Ingress:"
                      kubectl get ingress -n ${{ parameters.kubernetesNamespace }} -o wide
                      echo ""
                      ingress_ip="$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
                      if [ -z "$ingress_ip" ]; then
                        ingress_ip="$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
                      fi
                      if [ -n "$ingress_ip" ]; then
                        echo "Ingress public address: $ingress_ip"
                        echo "Website URL: http://${{ parameters.ingressHost }}"
                        echo "API health URL: http://${{ parameters.ingressHost }}/api/health"
                        echo "Namecheap A record target: $ingress_ip"
                      else
                        echo "Ingress public address: pending"
                        echo "Run: kubectl get svc ingress-nginx-controller -n ingress-nginx"
                      fi
                      echo "=================================================="
