trigger: none
pr: none

parameters:
  - name: tfStateResourceGroup
    type: string
    default: 'rg-three-tier-tfstate'
  - name: tfStateStorageAccount
    type: string
    default: 'threetiertfstatev06ckt7m'
  - name: tfStateContainer
    type: string
    default: 'tfstate'
  - name: tfStateKey
    type: string
    default: 'infra-dev.tfstate'
  - name: location
    type: string
    default: 'centralindia'
  - name: environment
    type: string
    default: 'dev'
  - name: projectName
    type: string
    default: 'three-tier'
  - name: resourceGroupName
    type: string
    default: 'rg-three-tier-dev'
  - name: aksName
    type: string
    default: 'aks-three-tier-dev'
  - name: acrName
    type: string
    default: 'acrthreetierdev123'
  - name: keyVaultName
    type: string
    default: 'kvthreetierdev123'
  - name: userAssignedIdentityName
    type: string
    default: 'uami-three-tier-app'
  - name: kubernetesVersion
    type: string
    default: '1.30'
  - name: nodeCount
    type: string
    default: '2'
  - name: nodeVmSize
    type: string
    default: 'Standard_D2s_v5'
  - name: kubernetesNamespace
    type: string
    default: 'three-tier'
  - name: helmReleaseName
    type: string
    default: 'three-tier'
  - name: enableClusterAddons
    type: string
    default: 'true'
  - name: decommission
    displayName: Decommission resources
    type: string
    default: 'false'
    values:
      - 'false'
      - 'true'

variables:
  - group: three-tier-app-config

stages:
  - stage: Infra
    displayName: Terraform Infra
    condition: eq('${{ parameters.decommission }}', 'false')
    jobs:
      - job: PlanApplyInfra
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: latest

          - task: AzureCLI@2
            displayName: Terraform init/plan/apply infra
            inputs:
              azureSubscription: 'sc-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                cd terraform/infra

                terraform init \
                  -backend-config="resource_group_name=${{ parameters.tfStateResourceGroup }}" \
                  -backend-config="storage_account_name=${{ parameters.tfStateStorageAccount }}" \
                  -backend-config="container_name=${{ parameters.tfStateContainer }}" \
                  -backend-config="key=${{ parameters.tfStateKey }}"

                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan
                terraform output
            env:
              TF_VAR_location: ${{ parameters.location }}
              TF_VAR_environment: ${{ parameters.environment }}
              TF_VAR_project_name: ${{ parameters.projectName }}
              TF_VAR_resource_group_name: ${{ parameters.resourceGroupName }}
              TF_VAR_aks_name: ${{ parameters.aksName }}
              TF_VAR_acr_name: ${{ parameters.acrName }}
              TF_VAR_key_vault_name: ${{ parameters.keyVaultName }}
              TF_VAR_user_assigned_identity_name: ${{ parameters.userAssignedIdentityName }}
              TF_VAR_kubernetes_version: ${{ parameters.kubernetesVersion }}
              TF_VAR_node_count: ${{ parameters.nodeCount }}
              TF_VAR_node_vm_size: ${{ parameters.nodeVmSize }}
              TF_VAR_namespace: ${{ parameters.kubernetesNamespace }}
              TF_VAR_release_name: ${{ parameters.helmReleaseName }}
              TF_VAR_enable_cluster_addons: ${{ parameters.enableClusterAddons }}
              TF_VAR_db_user: $(dbUser)
              TF_VAR_db_password: $(dbPassword)
              TF_VAR_db_name: $(dbName)

  - stage: DecommissionInfra
    displayName: Decommission Terraform Infrastructure
    dependsOn: Infra
    condition: and(always(), eq('${{ parameters.decommission }}', 'true'))
    jobs:
      - job: DestroyInfra
        displayName: Destroy infrastructure from remote state
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: latest
          - task: AzureCLI@2
            displayName: Terraform destroy from remote state
            inputs:
              azureSubscription: 'sc-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                pwsh -NoProfile -File scripts/decommission-infra.ps1 \
                  -Decommission '${{ parameters.decommission }}' \
                  -StateResourceGroup '${{ parameters.tfStateResourceGroup }}' \
                  -StateStorageAccount '${{ parameters.tfStateStorageAccount }}' \
                  -StateContainer '${{ parameters.tfStateContainer }}' \
                  -StateKey '${{ parameters.tfStateKey }}'
            env:
              TF_VAR_location: ${{ parameters.location }}
              TF_VAR_environment: ${{ parameters.environment }}
              TF_VAR_project_name: ${{ parameters.projectName }}
              TF_VAR_resource_group_name: ${{ parameters.resourceGroupName }}
              TF_VAR_aks_name: ${{ parameters.aksName }}
              TF_VAR_acr_name: ${{ parameters.acrName }}
              TF_VAR_key_vault_name: ${{ parameters.keyVaultName }}
              TF_VAR_user_assigned_identity_name: ${{ parameters.userAssignedIdentityName }}
              TF_VAR_kubernetes_version: ${{ parameters.kubernetesVersion }}
              TF_VAR_node_count: ${{ parameters.nodeCount }}
              TF_VAR_node_vm_size: ${{ parameters.nodeVmSize }}
              TF_VAR_namespace: ${{ parameters.kubernetesNamespace }}
              TF_VAR_release_name: ${{ parameters.helmReleaseName }}
              TF_VAR_enable_cluster_addons: ${{ parameters.enableClusterAddons }}
              TF_VAR_db_user: $(dbUser)
              TF_VAR_db_password: $(dbPassword)
              TF_VAR_db_name: $(dbName)
