{{- if and .Values.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "three-tier-app.componentName" (dict "root" . "component" "api-sa") }}
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    azure.workload.identity/client-id: {{ .Values.global.workloadIdentity.clientId | quote }}
automountServiceAccountToken: true
{{- end }}
