{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "three-tier-app.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "three-tier-app.componentName" (dict "root" . "component" "postgres-sa") }}
      containers:
        - name: postgres
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER_FILE
              value: /mnt/secrets-store/db-user
            - name: POSTGRES_PASSWORD_FILE
              value: /mnt/secrets-store/db-password
            - name: POSTGRES_DB_FILE
              value: /mnt/secrets-store/db-name
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -p {{ .Values.service.port }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "three-tier-app.componentName" (dict "root" . "component" "postgres-pvc") }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.global.workloadIdentity.secretProviderClassName | quote }}
{{- end }}
