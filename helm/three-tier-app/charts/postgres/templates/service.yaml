{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier-app.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: tcp-postgres
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- end }}
