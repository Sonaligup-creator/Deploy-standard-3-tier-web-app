{{- if and .Values.global.ingress.enabled .Values.global.ingress.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.global.ingress.tls.clusterIssuer }}
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.global.ingress.tls.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Values.global.ingress.tls.clusterIssuer }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.global.ingress.className }}
{{- end }}