{{- if .Values.api.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "three-tier-app.fullname" . }}-db-migrate
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Simulating database migration before API rollout"
              echo "Target database host: ${DB_HOST}"
              echo "Target database port: ${DB_PORT}"
              echo "Migration completed: pre-install-upgrade-hook"
          env:
            - name: DB_HOST
              value: {{ ternary (include "three-tier-app.componentName" (dict "root" . "component" "postgres")) .Values.global.database.externalHost .Values.postgres.enabled | quote }}
            - name: DB_PORT
              value: {{ .Values.global.database.port | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
