{{- if .Values.global.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "three-tier-app.fullname" . }}-ingress
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.global.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  rules:
    - host: {{ .Values.global.ingress.host }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          - path: {{ include "three-tier-app.frontendPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "three-tier-app.tierServiceName" (dict "root" . "tier" "frontend") }}
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- end }}
          {{- if .Values.api.enabled }}
          - path: {{ include "three-tier-app.apiPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "three-tier-app.tierServiceName" (dict "root" . "tier" "api") }}
                port:
                  number: {{ .Values.api.service.port }}
          {{- end }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.ingress.host }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
{{- end }}
